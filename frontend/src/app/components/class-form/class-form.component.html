<h2 mat-dialog-title>{{ isEdit ? 'Edit class' : 'New class' }}</h2>

<form [formGroup]="form" (ngSubmit)="save()">
  <mat-dialog-content class="form-grid">
    <mat-form-field appearance="outline">
      <mat-label>Class name</mat-label>
      <input matInput formControlName="name" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Description</mat-label>
      <input matInput formControlName="description" />
    </mat-form-field>

    <mat-form-field appearance="outline" *ngIf="isAdmin">
      <mat-label>Trainer</mat-label>
      <mat-select formControlName="trainer">
        <mat-option *ngFor="let t of trainers" [value]="t._id">{{ t.name }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Days</mat-label>
      <mat-select formControlName="days" multiple>
        <mat-option *ngFor="let d of weekDays" [value]="d">{{ d }}</mat-option>
      </mat-select>
    </mat-form-field>

    <div class="form-row">
      <mat-form-field appearance="outline">
        <mat-label>Start time</mat-label>
        <input matInput type="time" formControlName="startTime" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Duration (min)</mat-label>
        <input matInput type="number" formControlName="duration" />
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field appearance="outline">
        <mat-label>Capacity</mat-label>
        <input matInput type="number" formControlName="capacity" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Location</mat-label>
        <input matInput formControlName="location" />
      </mat-form-field>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close>Cancel</button>
    <button mat-flat-button color="primary" [disabled]="saving">
      {{ saving ? 'Saving…' : (isEdit ? 'Save changes' : 'Create') }}
    </button>
  </mat-dialog-actions>
</form>
