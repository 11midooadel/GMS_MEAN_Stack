<header class="list__head">
  <div>
    <h1 class="gms-page-title">{{ title }}</h1>
    <p class="gms-page-subtitle">Manage your gym {{ title.toLowerCase() }} and their roles.</p>
  </div>
  <button mat-flat-button color="primary" class="gms-pill" (click)="openForm()">
    <mat-icon>add</mat-icon> Add {{ roleFilter === 'Trainer' ? 'Trainer' : 'User' }}
  </button>
</header>

<div class="gms-card">
  <div class="list__toolbar">
    <mat-form-field appearance="outline" class="list__search" subscriptSizing="dynamic">
      <mat-icon matPrefix>search</mat-icon>
      <input matInput placeholder="Search by name or email" [(ngModel)]="search" (ngModelChange)="applySearch()" />
    </mat-form-field>
    <span class="gms-muted">{{ filtered.length }} total</span>
  </div>

  <div *ngIf="loading" class="list__loading">
    <mat-spinner diameter="36"></mat-spinner>
  </div>

  <table mat-table [dataSource]="filtered" *ngIf="!loading" class="list__table">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let u">
        <div class="list__user">
          <span class="list__avatar">{{ u.name.charAt(0).toUpperCase() }}</span>
          {{ u.name }}
        </div>
      </td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let u">{{ u.email }}</td>
    </ng-container>

    <ng-container matColumnDef="role">
      <th mat-header-cell *matHeaderCellDef>Role</th>
      <td mat-cell *matCellDef="let u"><span class="gms-chip is-active">{{ u.role }}</span></td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let u" class="list__actions">
        <button mat-icon-button (click)="openForm(u)" matTooltip="Edit"><mat-icon>edit</mat-icon></button>
        <button mat-icon-button color="warn" (click)="remove(u)" matTooltip="Delete"><mat-icon>delete_outline</mat-icon></button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
  </table>

  <p *ngIf="!loading && !filtered.length" class="list__empty gms-muted">No users found.</p>
</div>
