<header class="ml__head">
  <div>
    <h1 class="gms-page-title">{{ pageTitle }}</h1>
    <p class="gms-page-subtitle">Manage your gym members and their roles.</p>
  </div>
  <button *ngIf="canEdit" mat-flat-button color="primary" class="gms-pill" (click)="openAddModal()">
    <mat-icon>add</mat-icon> Add {{ currentRoleFilter === 'Trainer' ? 'Trainer' : 'Member' }}
  </button>
</header>

<div class="gms-card ml__search">
  <mat-icon>search</mat-icon>
  <input
    type="text"
    placeholder="Search by name or email"
    [(ngModel)]="searchTerm"
    (input)="applySearch()"
  />
  <span class="gms-muted ml__total">{{ filteredUsers.length }} total</span>
</div>

<div *ngIf="isLoading" class="ml__loading"><mat-spinner diameter="36"></mat-spinner></div>

<div class="gms-card ml__tablecard" *ngIf="!isLoading">
  <table mat-table [dataSource]="filteredUsers" class="ml__table">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let u">
        <div class="ml__user">
          <span class="ml__avatar">{{ initials(u.name) }}</span>
          {{ u.name }}
        </div>
      </td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let u">{{ u.email }}</td>
    </ng-container>

    <ng-container matColumnDef="role">
      <th mat-header-cell *matHeaderCellDef>Role</th>
      <td mat-cell *matCellDef="let u"><span class="gms-chip is-active">{{ u.role }}</span></td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let u" class="ml__actions">
        <button *ngIf="canEdit" mat-icon-button (click)="openEditModal(u)" matTooltip="Edit"><mat-icon>edit</mat-icon></button>
        <button *ngIf="canEdit" mat-icon-button color="warn" (click)="remove(u)" matTooltip="Delete"><mat-icon>delete_outline</mat-icon></button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="cols"></tr>
    <tr mat-row *matRowDef="let row; columns: cols"></tr>
  </table>

  <p *ngIf="!filteredUsers.length" class="gms-muted ml__empty">No users found.</p>
</div>
