<div class="list-container">
  <div class="list-header">
    <div>
      <h2>{{ pageTitle }}</h2>
    </div>

    <div class="header-actions">
      <input
        type="text"
        placeholder="Search..."
        [(ngModel)]="searchTerm"
        (input)="applySearch()"
        class="search-box"
      />
      <!-- Add Button: Super Admin & Admin Only -->
      <button *ngIf="canEdit" class="btn-primary" (click)="openAddModal()">
        + Add {{ currentRoleFilter === 'Trainer' ? 'Trainer' : 'User' }}
      </button>
    </div>
  </div>

  <div *ngIf="isLoading" class="list__loading"><mat-spinner diameter="36"></mat-spinner></div>

  <table mat-table [dataSource]="filteredUsers" *ngIf="!isLoading" class="list__table">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let u">
        <div class="list__user">
          <span class="list__avatar">{{ u.name.charAt(0).toUpperCase() }}</span>
          {{ u.name }}
        </div>
      </td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let u">{{ u.email }}</td>
    </ng-container>

    <ng-container matColumnDef="role">
      <th mat-header-cell *matHeaderCellDef>Role</th>
      <td mat-cell *matCellDef="let u"><span class="gms-chip is-active">{{ u.role }}</span></td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let u" class="list__actions">
        <button mat-icon-button (click)="viewAttendance(u)" matTooltip="Attendance"><mat-icon>how_to_reg</mat-icon></button>
        <button *ngIf="u.role === 'Member'" mat-icon-button (click)="viewHealth(u)" matTooltip="Health record"><mat-icon>monitor_heart</mat-icon></button>
        <button mat-icon-button (click)="openEditModal(u)" matTooltip="Edit"><mat-icon>edit</mat-icon></button>
        <button mat-icon-button color="warn" (click)="remove(u)" matTooltip="Delete"><mat-icon>delete_outline</mat-icon></button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="cols"></tr>
    <tr mat-row *matRowDef="let row; columns: cols"></tr>
  </table>

  <p *ngIf="!isLoading && !filteredUsers.length" class="gms-muted list__empty">No users found.</p>
</div>
