<div class="modal-container">
  <h2>{{ isEdit ? 'Edit User Role & Details' : 'Add New User' }}</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <!-- Name Field -->
    <div class="form-group">
      <label for="name">Full Name</label>
      <input id="name" type="text" formControlName="name" class="form-control" placeholder="Enter full name" />
    </div>

    <!-- Email Field -->
    <div class="form-group">
      <label for="email">Email Address</label>
      <input id="email" type="email" formControlName="email" class="form-control" placeholder="Enter email" />
    </div>

    <!-- Role Dropdown for Super Admin -->
    <div class="form-group">
      <label for="role">Role</label>
      <select id="role" formControlName="role" class="form-control select-control">
        <option value="member">Member</option>
        <option value="trainer">Trainer</option>
        <option value="admin">Admin</option>
        <option value="super_admin">Super Admin</option>
      </select>
    </div>

    <mat-form-field appearance="outline">
      <mat-label>Role</mat-label>
      <mat-select formControlName="role">
        <mat-option *ngFor="let r of roles" [value]="r">{{ r }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" *ngIf="form.controls.role.value === 'Member'">
      <mat-label>Assigned Trainer</mat-label>
      <mat-select formControlName="assignedTrainer">
        <mat-option value="">— None —</mat-option>
        <mat-option *ngFor="let t of trainers" [value]="t._id">{{ t.name }}</mat-option>
      </mat-select>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close>Cancel</button>
    <button mat-flat-button color="primary" [disabled]="saving">
      {{ saving ? 'Saving…' : 'Save' }}
    </button>
  </mat-dialog-actions>
</form>
