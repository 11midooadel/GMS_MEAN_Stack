<h2 mat-dialog-title>{{ isEdit ? 'Edit User' : 'Add New User' }}</h2>

<form [formGroup]="form" (ngSubmit)="save()">
  <mat-dialog-content class="mf">
    <mat-form-field appearance="outline" class="mf__field">
      <mat-label>Full name</mat-label>
      <input matInput formControlName="name" placeholder="Enter full name" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="mf__field">
      <mat-label>Email</mat-label>
      <input matInput type="email" formControlName="email" placeholder="Enter email" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="mf__field">
      <mat-label>{{ isEdit ? 'New password (optional)' : 'Password' }}</mat-label>
      <input matInput type="password" formControlName="password"
        [placeholder]="isEdit ? 'Leave blank to keep current' : 'Enter password'" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="mf__field">
      <mat-label>Role</mat-label>
      <mat-select formControlName="role">
        <mat-option *ngFor="let r of roles" [value]="r">{{ r }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="mf__field" *ngIf="form.controls.role.value === 'Member'">
      <mat-label>Assigned trainer</mat-label>
      <mat-select formControlName="assignedTrainer">
        <mat-option value="">— None —</mat-option>
        <mat-option *ngFor="let t of trainers" [value]="t._id">{{ t.name }}</mat-option>
      </mat-select>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close>Cancel</button>
    <button mat-flat-button color="primary" class="gms-pill" [disabled]="saving">
      {{ saving ? 'Saving…' : 'Save' }}
    </button>
  </mat-dialog-actions>
</form>
