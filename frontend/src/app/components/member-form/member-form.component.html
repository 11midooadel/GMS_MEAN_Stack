<div class="modal-container">
  <h2>{{ isEdit ? 'Edit User Role & Details' : 'Add New User' }}</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <!-- Name Field -->
    <div class="form-group">
      <label for="name">Full Name</label>
      <input id="name" type="text" formControlName="name" class="form-control" placeholder="Enter full name" />
    </div>

    <!-- Email Field -->
    <div class="form-group">
      <label for="email">Email Address</label>
      <input id="email" type="email" formControlName="email" class="form-control" placeholder="Enter email" />
    </div>

    <!-- Role Dropdown for Super Admin -->
    <div class="form-group">
      <label for="role">Role</label>
      <select id="role" formControlName="role" class="form-control select-control">
        <option value="member">Member</option>
        <option value="trainer">Trainer</option>
        <option value="admin">Admin</option>
        <option value="super_admin">Super Admin</option>
      </select>
    </div>

    <!-- Phone Field -->
    <div class="form-group">
      <label for="phone">Phone Number</label>
      <input id="phone" type="text" formControlName="phone" class="form-control" placeholder="Enter phone number" />
    </div>

    <!-- Password Field (Required only when creating a new user) -->
    <div class="form-group" *ngIf="!isEdit">
      <label for="password">Password</label>
      <input id="password" type="password" formControlName="password" class="form-control" placeholder="Enter password" />
    </div>

    <!-- Form Actions -->
    <div class="modal-actions">
      <button type="button" class="btn-cancel" (click)="onCancel()">Cancel</button>
      <button type="submit" class="btn-save" [disabled]="form.invalid">
        {{ isEdit ? 'Save Changes' : 'Create User' }}
      </button>
    </div>
  </form>
</div>
