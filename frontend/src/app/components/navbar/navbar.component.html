<header class="navbar">
  <button
    mat-icon-button
    class="navbar__menu"
    (click)="menuClick.emit()"
    aria-label="Toggle menu">
    <mat-icon>menu</mat-icon>
  </button>

  <div class="navbar__search">
    <mat-icon>search</mat-icon>
    <input type="text" placeholder="Search members, classes, plans…" />
  </div>

  <span class="gms-spacer"></span>

  <button mat-icon-button matTooltip="Notifications" aria-label="Notifications">
    <mat-icon [matBadge]="3" matBadgeColor="warn" matBadgeSize="small">notifications_none</mat-icon>
  </button>

  <button class="navbar__user" mat-button [matMenuTriggerFor]="userMenu">
    <span class="navbar__avatar">{{ initials }}</span>
    <span class="navbar__user-info">
      <span class="navbar__user-name">{{ user?.name }}</span>
      <span class="navbar__user-role">{{ user?.role }}</span>
    </span>
    <mat-icon>expand_more</mat-icon>
  </button>

  <mat-menu #userMenu="matMenu">
    <a mat-menu-item routerLink="/profile">
      <mat-icon>person</mat-icon><span>My Profile</span>
    </a>
    <button mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon><span>Log out</span>
    </button>
  </mat-menu>
</header>
