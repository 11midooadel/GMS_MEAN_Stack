<header class="navbar">
 
  <button
    mat-icon-button
    class="navbar__menu"
    aria-label="Toggle menu"
    (click)="menuClick.emit()">
    <mat-icon>menu</mat-icon>
  </button>

  <div class="navbar__search">
    <mat-icon>search</mat-icon>
    <input type="text" placeholder="Search members, classes, plans…" />
  </div>

  <span class="navbar__spacer"></span>

  <button
    mat-icon-button
    class="navbar__user-avatar"
    [matMenuTriggerFor]="userMenu"
    aria-label="User menu">
    <div class="avatar">{{ initials }}</div>
  </button>

  <mat-menu #userMenu="matMenu" class="user-menu-panel">
  <div class="user-menu__info">
    <div class="user-menu__avatar">{{ initials }}</div>
    <div class="user-menu__details">
      <div class="user-menu__name">{{ user?.name }}</div>
      <div class="user-menu__email">{{ user?.email }}</div>
      <div class="user-menu__role">{{ user?.role }}</div>
    </div>
  </div>

  <mat-divider></mat-divider>

  <button mat-menu-item routerLink="/profile">
    <mat-icon>person</mat-icon>
    <span>Profile</span>
  </button>

  <button mat-menu-item (click)="logout()">
    <mat-icon>logout</mat-icon>
    <span>Logout</span>
  </button>
</mat-menu>
</header>
