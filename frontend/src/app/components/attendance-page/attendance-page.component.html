<header class="att__head">
  <div>
    <h1 class="gms-page-title">Attendance</h1>
    <p class="gms-page-subtitle">Check in when you arrive and out when you leave.</p>
  </div>
  <div class="att__actions">
    <button mat-flat-button color="primary" class="gms-pill att__checkin" (click)="checkIn()">
      <mat-icon>login</mat-icon> Check In
    </button>
    <button mat-flat-button class="gms-pill att__checkout" (click)="checkOut()">
      <mat-icon>logout</mat-icon> Check Out
    </button>
  </div>
</header>

<div class="gms-card">
  <h3>My history</h3>
  <div *ngIf="loading" class="att__loading"><mat-spinner diameter="34"></mat-spinner></div>
  <table mat-table [dataSource]="records" *ngIf="!loading" class="att__table">
    <ng-container matColumnDef="checkIn">
      <th mat-header-cell *matHeaderCellDef>Check In</th>
      <td mat-cell *matCellDef="let r">{{ r.checkIn | date:'medium' }}</td>
    </ng-container>
    <ng-container matColumnDef="checkOut">
      <th mat-header-cell *matHeaderCellDef>Check Out</th>
      <td mat-cell *matCellDef="let r">{{ r.checkOut ? (r.checkOut | date:'medium') : '—' }}</td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="cols"></tr>
    <tr mat-row *matRowDef="let row; columns: cols"></tr>
  </table>
  <p *ngIf="!loading && !records.length" class="gms-muted">No attendance records yet.</p>
</div>
