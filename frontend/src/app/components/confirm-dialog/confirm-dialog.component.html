<div class="confirm">
  <span class="confirm__icon" [class.confirm__icon--danger]="danger">
    <mat-icon>{{ danger ? 'warning_amber' : 'help_outline' }}</mat-icon>
  </span>

  <h2 mat-dialog-title class="confirm__title">{{ data.title }}</h2>
  <p class="confirm__message">{{ data.message }}</p>

  <mat-dialog-actions class="confirm__actions">
    <button mat-flat-button class="gms-pill confirm__cancel" (click)="cancel()">
      {{ data.cancelText || 'Cancel' }}
    </button>
    <button mat-flat-button color="primary" class="gms-pill" (click)="confirm()">
      {{ data.confirmText || 'Confirm' }}
    </button>
  </mat-dialog-actions>
</div>
