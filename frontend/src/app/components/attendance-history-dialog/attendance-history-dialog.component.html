<h2 mat-dialog-title class="hist__title">{{ data.userName }} — Attendance</h2>

<mat-dialog-content class="hist__content">
  <div *ngIf="loading" class="hist__loading"><mat-spinner diameter="32"></mat-spinner></div>

  <table mat-table [dataSource]="records" *ngIf="!loading" class="hist__table">
    <ng-container matColumnDef="checkIn">
      <th mat-header-cell *matHeaderCellDef>Check In</th>
      <td mat-cell *matCellDef="let r">{{ r.checkIn | date:'medium' }}</td>
    </ng-container>
    <ng-container matColumnDef="checkOut">
      <th mat-header-cell *matHeaderCellDef>Check Out</th>
      <td mat-cell *matCellDef="let r">{{ r.checkOut ? (r.checkOut | date:'medium') : '—' }}</td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="cols"></tr>
    <tr mat-row *matRowDef="let row; columns: cols"></tr>
  </table>

  <p *ngIf="!loading && !records.length" class="gms-muted hist__empty">
    No attendance records yet.
  </p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-flat-button color="primary" class="gms-pill" mat-dialog-close>Close</button>
</mat-dialog-actions>
