<header class="pl__head" style="display: flex; justify-content: space-between; align-items: flex-start;">
  <div>
    <h1 class="gms-page-title">Membership Plans</h1>
    <p class="gms-page-subtitle">Choose the plan that fits your goals.</p>
  </div>
  
  <!-- Add button for Admins -->
  <button mat-flat-button color="primary" *ngIf="isAdmin" (click)="openAddPlanDialog()">
    + Add Plan
  </button>
</header>

<div *ngIf="loading" class="pl__loading"><mat-spinner diameter="40"></mat-spinner></div>

<div class="pl__grid" *ngIf="!loading">
  <article class="gms-card pl__card" *ngFor="let p of plans" [class.pl__card--off]="!p.isActive">
    <div class="pl__card-top">
      <h3>{{ p.name }}</h3>
      <span class="gms-chip" [class.is-active]="p.isActive" [class.is-expired]="!p.isActive">
        {{ p.isActive ? 'Active' : 'Disabled' }}
      </span>
    </div>
    <div class="pl__price"><strong>{{ p.price | currency:'EGP ' }}</strong><span>/ {{ p.durationInDays }} days</span></div>
    <p class="gms-muted">{{ p.description }}</p>
    
    <ul class="pl__features">
      <li *ngFor="let f of p.features"><mat-icon>check_circle</mat-icon> {{ f }}</li>
    </ul>
    
    <!-- Action buttons container -->
    <div class="pl__actions" *ngIf="isAdmin" style="display: flex; gap: 8px; flex-wrap: wrap;">
      <button mat-stroked-button color="primary" class="gms-pill" style="flex: 1;" *ngIf="p.isActive" (click)="disable(p)">Disable</button>
      <button mat-stroked-button class="gms-pill" style="flex: 1;" *ngIf="!p.isActive" (click)="enable(p)">Enable</button>
      <button mat-stroked-button color="primary" class="gms-pill" style="flex: 1;" (click)="openEditPlanDialog(p)">Edit</button>
      <button mat-stroked-button color="warn" class="gms-pill" style="flex: 1;" (click)="deletePlan(p)">Delete</button>
    </div>
  </article>
</div>

<p *ngIf="!loading && !plans.length" class="gms-muted pl__empty">No plans available.</p>
