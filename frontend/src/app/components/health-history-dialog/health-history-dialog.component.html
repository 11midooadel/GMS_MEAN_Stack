<h2 mat-dialog-title class="hhd__title">{{ data.memberName }} — Health Records</h2>

<mat-dialog-content class="hhd__content">
  <div *ngIf="loading" class="hhd__loading"><mat-spinner diameter="32"></mat-spinner></div>

  <table mat-table [dataSource]="records" *ngIf="!loading" class="hhd__table">
    <ng-container matColumnDef="date">
      <th mat-header-cell *matHeaderCellDef>Date</th>
      <td mat-cell *matCellDef="let r">{{ r.date | date }}</td>
    </ng-container>
    <ng-container matColumnDef="weight">
      <th mat-header-cell *matHeaderCellDef>Weight</th>
      <td mat-cell *matCellDef="let r">{{ r.weight }} kg</td>
    </ng-container>
    <ng-container matColumnDef="height">
      <th mat-header-cell *matHeaderCellDef>Height</th>
      <td mat-cell *matCellDef="let r">{{ r.height }} cm</td>
    </ng-container>
    <ng-container matColumnDef="bmi">
      <th mat-header-cell *matHeaderCellDef>BMI</th>
      <td mat-cell *matCellDef="let r">{{ bmi(r) }}</td>
    </ng-container>
    <ng-container matColumnDef="notes">
      <th mat-header-cell *matHeaderCellDef>Notes</th>
      <td mat-cell *matCellDef="let r">{{ r.notes || '—' }}</td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="cols"></tr>
    <tr mat-row *matRowDef="let row; columns: cols"></tr>
  </table>

  <p *ngIf="!loading && !records.length" class="gms-muted hhd__empty">
    No health records yet.
  </p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-flat-button color="primary" class="gms-pill" mat-dialog-close>Close</button>
</mat-dialog-actions>
