<header class="hl__head">
  <h1 class="gms-page-title">Health Records</h1>
  <p class="gms-page-subtitle">Track your weight, body composition and progress.</p>
</header>

<div class="hl__grid">
  <!-- Add record -->
  <section class="gms-card">
    <h3>Add a record</h3>
    <form [formGroup]="form" (ngSubmit)="save()" class="hl__form">
      <mat-form-field appearance="outline">
        <mat-label>Weight (kg)</mat-label>
        <input matInput type="number" formControlName="weight" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Height (cm)</mat-label>
        <input matInput type="number" formControlName="height" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Body fat %</mat-label>
        <input matInput type="number" formControlName="bodyFatPercentage" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Muscle mass (kg)</mat-label>
        <input matInput type="number" formControlName="muscleMass" />
      </mat-form-field>
      <mat-form-field appearance="outline" class="hl__full">
        <mat-label>Notes</mat-label>
        <input matInput formControlName="notes" />
      </mat-form-field>
      <button mat-flat-button color="primary" class="gms-pill hl__full" [disabled]="saving">
        {{ saving ? 'Saving…' : 'Save record' }}
      </button>
    </form>
  </section>

  <!-- History -->
  <section class="gms-card">
    <h3>History</h3>
    <div *ngIf="loading" class="hl__loading"><mat-spinner diameter="34"></mat-spinner></div>
    <table mat-table [dataSource]="records" *ngIf="!loading" class="hl__table">
      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef>Date</th>
        <td mat-cell *matCellDef="let r">{{ r.date | date }}</td>
      </ng-container>
      <ng-container matColumnDef="weight">
        <th mat-header-cell *matHeaderCellDef>Weight</th>
        <td mat-cell *matCellDef="let r">{{ r.weight }} kg</td>
      </ng-container>
      <ng-container matColumnDef="bmi">
        <th mat-header-cell *matHeaderCellDef>BMI</th>
        <td mat-cell *matCellDef="let r">{{ bmi(r) }}</td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="cols"></tr>
      <tr mat-row *matRowDef="let row; columns: cols"></tr>
    </table>
    <p *ngIf="!loading && !records.length" class="gms-muted">No records yet.</p>
  </section>
</div>
