<header class="sub__head">
  <h1 class="gms-page-title">Subscriptions</h1>
  <p class="gms-page-subtitle">Your membership status and renewal dates.</p>
</header>

<div *ngIf="loading" class="sub__loading"><mat-spinner diameter="40"></mat-spinner></div>

<div class="sub__grid" *ngIf="!loading">
  <article class="gms-card sub__card" *ngFor="let s of subs">
    <div class="sub__top">
      <h3>{{ planName(s) }}</h3>
      <span class="gms-chip"
        [class.is-active]="s.status === 'Active'"
        [class.is-pending]="s.status === 'Pending' || s.status === 'Frozen'"
        [class.is-expired]="s.status === 'Expired' || s.status === 'Cancelled'">
        {{ s.status }}
      </span>
    </div>
    <div class="sub__dates">
      <div><span class="gms-muted">Start</span><strong>{{ s.startDate | date }}</strong></div>
      <div><span class="gms-muted">End</span><strong>{{ s.endDate | date }}</strong></div>
    </div>
    <button mat-stroked-button color="warn" class="gms-pill"
      *ngIf="s.status === 'Active' || s.status === 'Pending'"
      (click)="cancel(s)">Cancel subscription</button>
  </article>
</div>

<p *ngIf="!loading && !subs.length" class="gms-muted sub__empty">No subscriptions found.</p>
