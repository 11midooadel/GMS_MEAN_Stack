<header class="pay__head">
  <h1 class="gms-page-title">Payments</h1>
  <p class="gms-page-subtitle">Transaction history and payment status.</p>
</header>

<div class="gms-card">
  <div *ngIf="loading" class="pay__loading"><mat-spinner diameter="34"></mat-spinner></div>

  <table mat-table [dataSource]="payments" *ngIf="!loading" class="pay__table">
    <ng-container matColumnDef="member">
      <th mat-header-cell *matHeaderCellDef>Member</th>
      <td mat-cell *matCellDef="let p">{{ memberName(p) }}</td>
    </ng-container>
    <ng-container matColumnDef="amount">
      <th mat-header-cell *matHeaderCellDef>Amount</th>
      <td mat-cell *matCellDef="let p">{{ p.amount | currency }}</td>
    </ng-container>
    <ng-container matColumnDef="method">
      <th mat-header-cell *matHeaderCellDef>Method</th>
      <td mat-cell *matCellDef="let p">{{ p.paymentMethod }}</td>
    </ng-container>
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let p">
        <span class="gms-chip"
          [class.is-active]="p.status === 'Completed'"
          [class.is-pending]="p.status === 'Pending'"
          [class.is-expired]="p.status === 'Failed' || p.status === 'Refunded'">{{ p.status }}</span>
      </td>
    </ng-container>
    <ng-container matColumnDef="date">
      <th mat-header-cell *matHeaderCellDef>Date</th>
      <td mat-cell *matCellDef="let p">{{ p.paymentDate | date }}</td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="cols"></tr>
    <tr mat-row *matRowDef="let row; columns: cols"></tr>
  </table>

  <p *ngIf="!loading && !payments.length" class="gms-muted">No payments found.</p>
</div>
