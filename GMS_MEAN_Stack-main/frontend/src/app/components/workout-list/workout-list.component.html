<header class="wk__head">
  <div>
    <h1 class="gms-page-title">Workout Plans</h1>
    <p class="gms-page-subtitle">Your personalized training programs.</p>
  </div>
</header>

<div *ngIf="loading" class="wk__loading"><mat-spinner diameter="40"></mat-spinner></div>

<div class="wk__grid" *ngIf="!loading">
  <article class="gms-card wk__card" *ngFor="let p of plans">
    <div class="wk__card-top">
      <span class="wk__icon"><mat-icon>assignment</mat-icon></span>
      <span class="gms-chip is-active">{{ p.days.length }} days</span>
    </div>
    <h3 class="wk__name">{{ p.name }}</h3>
    <p class="gms-muted wk__desc">{{ p.description || 'Training plan' }}</p>

    <div class="wk__days">
      <div class="wk__day" *ngFor="let d of p.days">
        <strong>{{ d.day }}</strong>
        <span class="gms-muted">{{ d.exercises.length }} exercises</span>
      </div>
    </div>

    <div class="wk__foot gms-muted">
      <span><mat-icon>exercise</mat-icon> {{ totalExercises(p) }} total exercises</span>
    </div>
  </article>
</div>

<p *ngIf="!loading && !plans.length" class="gms-muted wk__empty">No workout plans yet.</p>
